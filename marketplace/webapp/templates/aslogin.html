<!DOCTYPE html>
<html lang="en">

<head>
    <title>AS Login · Marketplace</title>
    {{template "head" .}}
</head>

<body>
    {{template "nav-as" .}}
    <main class="page">
        <section class="card small">
            <h2>AS Login</h2>
            {{if .Error}}
            <p class="error" role="alert">{{.Error}}</p>
            {{end}}
            <form class="form-vertical" method="POST" action="/aslogin">
                <label>
                    ISD-AS number
                    <input name="username" placeholder="1-ff00:0:110" autocomplete="username">
                </label>
                <label>
                    Password
                    <input name="password" type="password" autocomplete="current-password">
                </label>
                <button type="submit">Login</button>
            </form>
        </section>
    </main>
</body>

</html>
