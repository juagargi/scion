<!DOCTYPE html>
<html lang="en">

<head>
    <title>Balance · Marketplace</title>
    {{template "head" .}}
</head>

<body>
    {{template "nav-as" .}}
    <main class="page">
        <h2>Balance</h2>
        <p class="error" id="error" role="alert">{{.Error}}</p>

        <section class="card">
            <h3>Account balance</h3>
            {{if .Balance}}
            <p class="balance">{{.Balance}}</p>
            {{end}}
        </section>
    </main>
</body>

</html>
