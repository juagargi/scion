<!DOCTYPE html>
<html lang="en">

<head>
    <title>Register · Marketplace</title>
    {{template "head" .}}
</head>

<body>
    {{template "nav-user" .}}
    <main class="page">
        <section class="card small">
            <h2>Register</h2>
            {{if .Error}}
            <p class="error" role="alert">{{.Error}}</p>
            {{end}}
            <form class="form-vertical" method="POST" action="/register">
                <label>
                    User ID
                    <input name="username" autocomplete="username">
                </label>
                <label>
                    Password
                    <input name="password" type="password" autocomplete="new-password" pattern="[A-Za-z0-9_\-]{1,20}"
                        title="Must contain only letters, numbers, '_' or '-' with a length between 1 and 20 characters">
                </label>
                <button type="submit">Register</button>
            </form>
            <p class="form-footer">Already registered? <a href="/login">Login</a></p>
        </section>
    </main>
</body>

</html>
