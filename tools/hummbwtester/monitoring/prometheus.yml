global:
  scrape_interval: 1s

storage:
  tsdb:
    # Accept samples that the SSH deployment's Prometheus agents buffered while they could not
    # deliver; without it, samples older than about an hour are refused and the agents drop
    # them. Keep it at least the agents' retention (ssh_setup.AGENT_RETENTION).
    out_of_order_time_window: 180d

scrape_configs:
  - job_name: "hummbwtester-client"
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/clients.json

  - job_name: "scion-border-routers"
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/border_routers.json
