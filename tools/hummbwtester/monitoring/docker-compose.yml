services:
  prometheus:
    image: prom/prometheus:latest
    container_name: hummbwtester-prometheus
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.listen-address=:${PROMETHEUS_PORT:-8090}"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../../gen/hummbwtester-prometheus:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana-oss:latest
    container_name: hummbwtester-grafana
    depends_on:
      - prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROMETHEUS_PORT: "${PROMETHEUS_PORT:-8090}"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
