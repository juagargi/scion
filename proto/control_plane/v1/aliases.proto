syntax = "proto3";

option go_package = "github.com/scionproto/scion/pkg/proto/control_plane";

package proto.control_plane.v1;


service AliasesService {
    rpc RegisterAlias(RegisterAliasRequest) returns (RegisterAliasResponse) {}
    rpc GetAliases(GetAliasesRequest) returns (GetAliasesResponse) {}
}

message RegisterAliasRequest {
    string host = 1;
    repeated Replica replicas = 3;
}
message RegisterAliasResponse {}

message GetAliasesRequest {
    string host = 1;
}
message GetAliasesResponse {
    repeated Replica replicas = 1;
}


message Replica {
    uint64 isd_as = 1;
    string host = 2;
    uint32 not_after = 3;
}